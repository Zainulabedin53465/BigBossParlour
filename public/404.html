<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | BIG BOSS PARLOUR</title>
  <style>
    html,body{margin:0;height:100%;background:#050505;color:#efe9da;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
    main{min-height:100%;display:grid;place-content:center;text-align:center;padding:2rem;gap:.75rem}
    .code{margin:0;font:700 clamp(4rem,18vw,9rem)/1 Impact,'Arial Narrow',sans-serif;color:#d4af37;letter-spacing:.04em}
    h1{margin:0;font-size:1.1rem;letter-spacing:.3em}
    p{margin:0;color:#b4ab97}
    a{display:inline-block;margin-top:1rem;padding:.9rem 1.6rem;background:#d4af37;color:#050505;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
    a:focus-visible{outline:3px solid #f5dc8e;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>PAGE NOT FOUND</h1>
    <p>That page does not exist. The main site has everything you need.</p>
    <div><a id="home" href="/">Back to BIG BOSS PARLOUR</a></div>
  </main>
  <script>
    // On GitHub project pages the site lives at /<repo>/, so build the home link from the first path segment.
    (function () {
      var seg = location.pathname.split('/')[1];
      var base = location.hostname.slice(-9) === 'github.io' && seg ? '/' + seg + '/' : '/';
      document.getElementById('home').setAttribute('href', base);
    })();
  </script>
</body>
</html>
